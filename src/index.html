  <!-- Hide the chatbot bubble while the intro runs (home only). -->
  <style>.vxc-intro .vxc-launch,.vxc-intro .vxc-panel{display:none !important}</style>
  <script>
    (function () {
      var p = (location.pathname || '/').toLowerCase().replace(/\/+$/, '') || '/';
      if (p !== '/' && p !== '/en') return;
      var html = document.documentElement;
      html.classList.add('vxc-intro');
      function reveal() { html.classList.remove('vxc-intro'); }
      // Show the bubble exactly when the intro FINISHES (not during).
      window.addEventListener('intro-finished', reveal);
      setTimeout(reveal, 9000); // failsafe: in case the event never fires, don't keep it hidden forever
    })();
  </script>
