<!--
  Intro de 3 tiempos. Texto REAL en el DOM (no canvas ni SVG con paths), para que
  Google y los motores de IA puedan leerlo, y para que con JavaScript deshabilitado
  no quede nada tapando el hero (el overlay solo se monta en el navegador).
  problema → solución → marca.
-->
<div class="intro" [class.leaving]="leaving()" role="status" [attr.aria-label]="'INTRO.LOADING' | translate"
     (click)="skip()">
  <div class="beats">
    <p class="beat" [class.on]="beat() === 1">{{ 'INTRO.BEAT1' | translate }}</p>
    <p class="beat" [class.on]="beat() === 2">{{ 'INTRO.BEAT2' | translate }}</p>
    <div class="beat brand" [class.on]="beat() === 3">
      <span class="mark">{{ 'INTRO.BRAND' | translate }}</span>
      <span class="tag">{{ 'INTRO.TAGLINE' | translate }}</span>
    </div>
  </div>

  <div class="skip-hint" aria-hidden="true">
    <span class="skip-text skip-desktop">{{ 'INTRO.SKIP' | translate }}</span>
    <span class="skip-text skip-mobile">{{ 'INTRO.SKIP_MOBILE' | translate }}</span>
  </div>
</div>
